name: Build APK dan IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Membuat kerangka Android, lalu mengembalikan berkas proyek ini bila ikut tertimpa.
      - name: Buat kerangka Android
        run: |
          flutter create --org id.cuaca --project-name cuaca_kelurahan --platforms android .
          git checkout -- pubspec.yaml lib assets test tool analysis_options.yaml

      - name: Sesuaikan manifest
        run: dart run tool/patch_project.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cuaca-kelurahan-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat kerangka iOS
        run: |
          flutter create --org id.cuaca --project-name cuaca_kelurahan --platforms ios .
          git checkout -- pubspec.yaml lib assets test tool analysis_options.yaml

      - name: Sesuaikan Info.plist dan target iOS
        run: dart run tool/patch_project.dart

      - run: flutter pub get

      # Build rilis tanpa tanda tangan. Penandatanganan dilakukan di komputer Anda
      # (Sideloadly) memakai Apple ID sendiri, jadi tidak ada rahasia yang disimpan di CI.
      - run: flutter build ios --release --no-codesign

      - name: Bungkus menjadi IPA (tanpa tanda tangan)
        run: |
          rm -rf Payload cuaca_kelurahan_unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry cuaca_kelurahan_unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: cuaca-kelurahan-ipa
          path: cuaca_kelurahan_unsigned.ipa
